<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1440" height="900" fill="#F8FAFC"/>

  <!-- Sidebar -->
  <rect width="220" height="900" fill="#0F172A"/>
  <rect x="24" y="24" width="28" height="28" rx="6" fill="#2563EB"/>
  <text x="38" y="43" text-anchor="middle" font-size="14" font-weight="800" fill="white">C</text>
  <text x="62" y="43" font-size="14" font-weight="700" fill="white">Certus</text>
  <rect x="24" y="98" width="16" height="16" rx="3" fill="#475569"/>
  <text x="48" y="111" font-size="13" fill="#94A3B8">Dashboard</text>
  <rect x="24" y="134" width="16" height="16" rx="3" fill="#475569"/>
  <text x="48" y="147" font-size="13" fill="#94A3B8">Suppliers</text>
  <rect x="12" y="160" width="196" height="36" rx="6" fill="#2563EB"/>
  <rect x="24" y="170" width="16" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="48" y="183" font-size="13" font-weight="600" fill="white">Query Tracker</text>
  <rect x="24" y="206" width="16" height="16" rx="3" fill="#475569"/>
  <text x="48" y="219" font-size="13" fill="#94A3B8">Certificates</text>
  <rect x="24" y="242" width="16" height="16" rx="3" fill="#475569"/>
  <text x="48" y="255" font-size="13" fill="#94A3B8">Reports</text>
  <circle cx="32" cy="870" r="14" fill="#1E293B"/>
  <text x="32" y="875" text-anchor="middle" font-size="11" font-weight="600" fill="#94A3B8">QM</text>
  <text x="54" y="866" font-size="12" font-weight="600" fill="#CBD5E1">Quality Manager</text>
  <text x="54" y="880" font-size="11" fill="#64748B">qm@acme.com</text>

  <!-- Top bar -->
  <rect x="220" y="0" width="1220" height="60" fill="white"/>
  <rect x="220" y="59" width="1220" height="1" fill="#E2E8F0"/>
  <text x="244" y="36" font-size="13" fill="#64748B">Query Tracker</text>
  <text x="330" y="36" font-size="13" fill="#CBD5E1"> / </text>
  <text x="344" y="36" font-size="13" font-weight="600" fill="#0F172A">Raise New Query</text>
  <rect x="1290" y="16" width="120" height="32" rx="6" fill="#F1F5F9"/>
  <text x="1350" y="36" text-anchor="middle" font-size="12" fill="#475569">Save Draft</text>

  <!-- Stepper -->
  <rect x="232" y="68" width="780" height="64" fill="white"/>
  <rect x="232" y="132" width="780" height="1" fill="#E2E8F0"/>
  <!-- Step 1 — active -->
  <circle cx="296" cy="100" r="16" fill="#2563EB"/>
  <text x="296" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="white">1</text>
  <text x="296" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#2563EB">Select Supplier</text>
  <rect x="312" y="99" width="148" height="2" fill="#2563EB"/>
  <!-- Step 2 — pending -->
  <circle cx="460" cy="100" r="16" fill="#E2E8F0"/>
  <text x="460" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#94A3B8">2</text>
  <text x="460" y="128" text-anchor="middle" font-size="11" fill="#94A3B8">Query Details</text>
  <rect x="476" y="99" width="148" height="2" fill="#E2E8F0"/>
  <!-- Step 3 — pending -->
  <circle cx="624" cy="100" r="16" fill="#E2E8F0"/>
  <text x="624" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#94A3B8">3</text>
  <text x="624" y="128" text-anchor="middle" font-size="11" fill="#94A3B8">Schedule &amp; Attach</text>

  <!-- LEFT: Main form area (60%) -->
  <rect x="232" y="132" width="780" height="768" fill="white"/>

  <!-- Step 1: Supplier Selection -->
  <text x="256" y="172" font-size="16" font-weight="700" fill="#0F172A">Step 1 — Select Supplier</text>
  <text x="256" y="190" font-size="12" fill="#64748B">Choose the supplier this query will be raised against</text>

  <!-- Search field -->
  <rect x="256" y="204" width="720" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="276" y="229" font-size="13" fill="#94A3B8">Search by supplier name, ID or category…</text>

  <!-- Selected supplier card -->
  <rect x="256" y="260" width="720" height="104" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="256" y="260" width="4" height="104" rx="2" fill="#2563EB"/>
  <!-- Supplier info -->
  <circle cx="294" cy="312" r="20" fill="#DBEAFE"/>
  <text x="294" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">TP</text>
  <text x="324" y="300" font-size="15" font-weight="700" fill="#0F172A">Tektra Polymers</text>
  <text x="324" y="318" font-size="12" fill="#475569">ID: SUP-0042 · Raw Materials · 148 active suppliers</text>
  <!-- Risk pill -->
  <rect x="324" y="330" width="88" height="22" rx="4" fill="#FEE2E2"/>
  <text x="368" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">HIGH RISK</text>
  <rect x="424" y="330" width="100" height="22" rx="4" fill="#FEF3C7"/>
  <text x="474" y="345" text-anchor="middle" font-size="11" font-weight="600" fill="#D97706">72% Compliance</text>
  <rect x="536" y="330" width="112" height="22" rx="4" fill="#FEE2E2"/>
  <text x="592" y="345" text-anchor="middle" font-size="11" font-weight="600" fill="#DC2626">5 open queries</text>
  <!-- Change button -->
  <rect x="908" y="296" width="56" height="28" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="936" y="314" text-anchor="middle" font-size="12" fill="#475569">Change</text>

  <!-- Alert — high risk -->
  <rect x="256" y="380" width="720" height="52" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <circle cx="278" cy="406" r="10" fill="#DC2626"/>
  <text x="278" y="411" text-anchor="middle" font-size="11" font-weight="700" fill="white">!</text>
  <text x="298" y="402" font-size="13" font-weight="600" fill="#991B1B">High-risk supplier selected</text>
  <text x="298" y="420" font-size="12" fill="#B91C1C">This supplier has an open ISO 9001 renewal (QRY-0228) and 4 other active queries. Consider priority escalation.</text>

  <!-- Query Details form (Step 2 preview) -->
  <text x="256" y="464" font-size="16" font-weight="700" fill="#0F172A">Query Details</text>
  <!-- Subject -->
  <text x="256" y="490" font-size="12" font-weight="600" fill="#374151">Subject <tspan fill="#DC2626">*</tspan></text>
  <rect x="256" y="498" width="720" height="40" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
  <text x="276" y="523" font-size="13" fill="#0F172A">Product Safety Data Sheet — Rev 4 Update Required</text>

  <!-- Category + Priority row -->
  <text x="256" y="562" font-size="12" font-weight="600" fill="#374151">Category <tspan fill="#DC2626">*</tspan></text>
  <rect x="256" y="570" width="344" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="276" y="595" font-size="13" fill="#0F172A">Safety &amp; Compliance</text>
  <text x="618" y="562" font-size="12" font-weight="600" fill="#374151">Priority <tspan fill="#DC2626">*</tspan></text>
  <rect x="618" y="570" width="358" height="40" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="638" y="595" font-size="13" font-weight="600" fill="#DC2626">Critical</text>
  <rect x="912" y="583" width="44" height="18" rx="4" fill="#FEE2E2"/>
  <text x="934" y="596" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">▾</text>

  <!-- Description -->
  <text x="256" y="634" font-size="12" font-weight="600" fill="#374151">Description <tspan fill="#DC2626">*</tspan></text>
  <rect x="256" y="642" width="720" height="80" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="276" y="666" font-size="13" fill="#0F172A">The product formula was updated in April 2026 following supplier</text>
  <text x="276" y="684" font-size="13" fill="#0F172A">audit findings. An updated MSDS / Safety Data Sheet (Rev 4) is</text>
  <text x="276" y="702" font-size="13" fill="#0F172A">required per regulatory requirements before the next shipment.</text>

  <!-- Nav buttons -->
  <rect x="256" y="754" width="160" height="40" rx="8" fill="#F1F5F9"/>
  <text x="336" y="778" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">← Back</text>
  <rect x="796" y="754" width="180" height="40" rx="8" fill="#2563EB"/>
  <text x="886" y="778" text-anchor="middle" font-size="13" font-weight="600" fill="white">Next: Schedule →</text>

