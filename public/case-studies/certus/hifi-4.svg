  <rect x="1028" y="422" width="396" height="1" fill="#E2E8F0"/>
  <!-- Query rows -->
  <rect x="1048" y="434" width="80" height="20" rx="4" fill="#FEE2E2"/>
  <text x="1088" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">Overdue</text>
  <text x="1140" y="448" font-size="12" font-weight="600" fill="#DC2626">QRY-0228 ISO 9001 Renewal</text>

  <rect x="1048" y="464" width="80" height="20" rx="4" fill="#FEF9C3"/>
  <text x="1088" y="478" text-anchor="middle" font-size="10" font-weight="600" fill="#854D0E">Pending</text>
  <text x="1140" y="478" font-size="12" fill="#475569">QRY-0235 Safety Data Sheet</text>

  <rect x="1048" y="494" width="88" height="20" rx="4" fill="#E0F2FE"/>
  <text x="1092" y="508" text-anchor="middle" font-size="10" font-weight="600" fill="#0891B2">In Review</text>
  <text x="1148" y="508" font-size="12" fill="#475569">QRY-0221 Audit Report H1</text>

  <rect x="1048" y="524" width="80" height="20" rx="4" fill="#FEF9C3"/>
  <text x="1088" y="538" text-anchor="middle" font-size="10" font-weight="600" fill="#854D0E">Pending</text>
  <text x="1140" y="538" font-size="12" fill="#475569">QRY-0211 CoC Declaration</text>

  <rect x="1048" y="554" width="80" height="20" rx="4" fill="#FEF9C3"/>
  <text x="1088" y="568" text-anchor="middle" font-size="10" font-weight="600" fill="#854D0E">Pending</text>
  <text x="1140" y="568" font-size="12" fill="#475569">QRY-0204 REACH Compliance</text>

  <!-- Certificate expiry card -->
  <rect x="1028" y="616" width="396" height="164" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1048" y="642" font-size="14" font-weight="700" fill="#0F172A">Certificate Expiry</text>
  <rect x="1028" y="654" width="396" height="1" fill="#E2E8F0"/>
  <!-- Cert rows -->
  <text x="1048" y="678" font-size="12" font-weight="600" fill="#DC2626">ISO 9001:2015</text>
  <text x="1380" y="678" text-anchor="end" font-size="12" font-weight="700" fill="#DC2626">28 Jun 2026</text>
  <text x="1048" y="695" font-size="11" fill="#94A3B8">Quality Management System</text>
  <text x="1380" y="695" text-anchor="end" font-size="11" fill="#EF4444">10 days</text>

  <rect x="1048" y="702" width="336" height="1" fill="#F1F5F9"/>

  <text x="1048" y="722" font-size="12" fill="#D97706">ISO 14001:2015</text>
  <text x="1380" y="722" text-anchor="end" font-size="12" font-weight="600" fill="#D97706">15 Aug 2026</text>
  <text x="1048" y="739" font-size="11" fill="#94A3B8">Environmental Management</text>
  <text x="1380" y="739" text-anchor="end" font-size="11" fill="#F59E0B">58 days</text>

  <rect x="1048" y="746" width="336" height="1" fill="#F1F5F9"/>

  <text x="1048" y="766" font-size="12" fill="#475569">OHSAS 18001</text>
  <text x="1380" y="766" text-anchor="end" font-size="12" fill="#475569">12 Jan 2027</text>
  <text x="1048" y="783" font-size="11" fill="#94A3B8">Occupational Health &amp; Safety</text>
  <text x="1380" y="783" text-anchor="end" font-size="11" fill="#94A3B8">208 days</text>
</svg>
