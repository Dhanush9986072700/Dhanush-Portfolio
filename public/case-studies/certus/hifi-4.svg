  <rect x="1048" y="244" width="242" height="6" rx="3" fill="#DC2626"/>
  <text x="1048" y="270" font-size="12" fill="#64748B">Open Queries</text>
  <text x="1380" y="270" text-anchor="end" font-size="12" font-weight="700" fill="#D97706">5</text>
  <text x="1048" y="298" font-size="12" fill="#64748B">Certificates on file</text>
  <text x="1380" y="298" text-anchor="end" font-size="12" font-weight="600" fill="#0F172A">8</text>
  <text x="1048" y="326" font-size="12" fill="#64748B">Last audit</text>
  <text x="1380" y="326" text-anchor="end" font-size="12" fill="#0F172A">Mar 2026</text>
  <text x="1048" y="354" font-size="12" fill="#64748B">Relationship since</text>
  <text x="1380" y="354" text-anchor="end" font-size="12" fill="#0F172A">Jan 2021</text>

  <!-- Active queries card -->
  <rect x="1028" y="384" width="396" height="216" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
