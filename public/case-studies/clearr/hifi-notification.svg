<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bgnot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="100%" stop-color="#131325"/>
    </linearGradient>
    <linearGradient id="notif-glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F0F1A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Phone background (blurred app state) -->
  <rect width="390" height="844" fill="url(#bgnot)"/>

  <!-- Blurred background content (home screen) -->
  <rect x="16" y="52" width="358" height="128" rx="12" fill="rgba(28,28,46,0.4)"/>
  <rect x="36" y="76" width="80" height="8" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="36" y="92" width="140" height="30" rx="4" fill="rgba(255,255,255,0.04)"/>
  <rect x="36" y="140" width="200" height="6" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="16" y="196" width="358" height="52" rx="8" fill="rgba(28,28,46,0.3)"/>
  <rect x="16" y="258" width="358" height="52" rx="8" fill="rgba(28,28,46,0.3)"/>

  <!-- Blur overlay -->
  <rect width="390" height="844" fill="rgba(10,10,20,0.55)"/>

  <!-- Notification card (OS-style) -->
  <rect x="16" y="320" width="358" height="200" rx="20" fill="rgba(22,22,42,0.96)"/>
  <rect x="16" y="320" width="358" height="200" rx="20" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>

  <!-- Notification glow -->
  <ellipse cx="195" cy="330" rx="170" ry="40" fill="url(#notif-glow)"/>

  <!-- App icon + name -->
  <rect x="32" y="338" width="28" height="28" rx="8" fill="#6366F1"/>
  <text x="46" y="357" font-family="Inter,sans-serif" font-size="13" fill="white" font-weight="800" text-anchor="middle">C</text>
  <text x="70" y="350" font-family="Inter,sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" font-weight="600">Clearr</text>
  <text x="358" y="350" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)" text-anchor="end">now</text>

  <!-- Divider -->
  <line x1="32" y1="372" x2="358" y2="372" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Notification headline -->
  <text x="32" y="398" font-family="Inter,sans-serif" font-size="16" fill="white" font-weight="700">Food's running hot 🍔</text>

  <!-- Notification body -->
  <text x="32" y="420" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">You've spent</text>
  <text x="111" y="420" font-family="Inter,sans-serif" font-size="13" fill="#FBBF24" font-weight="600">₹3,420 on food</text>
  <text x="240" y="420" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">this month —</text>
  <text x="32" y="438" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">that's</text>
  <text x="67" y="438" font-family="Inter,sans-serif" font-size="13" fill="#FBBF24" font-weight="600">68% more</text>
  <text x="142" y="438" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">than last June.</text>

  <!-- Context line -->
  <text x="32" y="462" font-family="Inter,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)">Mostly Swiggy. 4 orders this week.</text>

  <!-- Divider -->
  <line x1="32" y1="476" x2="358" y2="476" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Action buttons -->
  <text x="100" y="500" font-family="Inter,sans-serif" font-size="13" fill="#6366F1" font-weight="600" text-anchor="middle">See breakdown</text>
  <line x1="195" y1="482" x2="195" y2="514" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="280" y="500" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.35)" text-anchor="middle">Dismiss</text>

  <!-- Design principle annotation -->
  <text x="195" y="560" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)" text-anchor="middle">Triggered only when delta &gt; 40% vs same period</text>
  <text x="195" y="578" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)" text-anchor="middle">last month. Max 2 notifications/week per category.</text>

  <!-- Second notification (stacked below, slightly smaller) -->
  <rect x="26" y="610" width="338" height="110" rx="16" fill="rgba(18,18,36,0.92)"/>
  <rect x="26" y="610" width="338" height="110" rx="16" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <rect x="40" y="624" width="22" height="22" rx="6" fill="#6366F1" opacity="0.7"/>
  <text x="51" y="640" font-family="Inter,sans-serif" font-size="11" fill="white" font-weight="800" text-anchor="middle">C</text>
  <text x="72" y="636" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" font-weight="600">Clearr</text>
  <text x="352" y="636" font-family="Inter,sans-serif" font-size="10" fill="rgba(255,255,255,0.2)" text-anchor="end">2h ago</text>
  <text x="40" y="660" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" font-weight="600">Bill due in 8 days</text>
  <text x="40" y="678" font-family="Inter,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)">Estimated ₹14,100 · You're on track 😌</text>
  <text x="40" y="710" font-family="Inter,sans-serif" font-size="11" fill="#2DD4BF">Review bill →</text>

  <!-- Bottom -->
  <rect y="762" width="390" height="82" fill="rgba(10,10,21,0.8)"/>
  <rect y="762" width="390" height="1" fill="rgba(255,255,255,0.04)"/>
  <rect x="155" y="808" width="80" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
</svg>