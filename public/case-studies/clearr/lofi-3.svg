<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#E8E8E8"/>

  <!-- Screen label -->
  <rect width="390" height="28" fill="#CCCCCC"/>
  <text x="195" y="18" font-family="monospace" font-size="9" fill="#666" font-weight="700" letter-spacing="0.8" text-anchor="middle">LO-FI · CLEARR · BILL PREVIEW</text>

  <!-- Status bar -->
  <rect y="28" width="390" height="24" fill="#D8D8D8"/>
  <text x="16" y="44" font-family="monospace" font-size="9" fill="#999" font-weight="700">9:41</text>

  <!-- Header -->
  <rect y="52" width="390" height="52" fill="#E8E8E8"/>
  <rect x="16" y="66" width="28" height="24" rx="4" fill="#D0D0D0"/>
  <text x="60" y="80" font-family="monospace" font-size="9" fill="#999" font-weight="700" letter-spacing="0.8">BILL PREVIEW</text>
  <text x="60" y="92" font-family="monospace" font-size="8" fill="#AAAAAA" font-weight="700" letter-spacing="0.5">DUE IN 8 DAYS</text>

  <!-- Bill summary card -->
  <rect x="16" y="116" width="358" height="140" rx="8" fill="#D0D0D0"/>
  <text x="32" y="140" font-family="monospace" font-size="9" fill="#999" font-weight="700" letter-spacing="0.8">ESTIMATED BILL</text>
  <rect x="32" y="148" width="160" height="36" rx="4" fill="#BBBBBB"/>
  <text x="32" y="200" font-family="monospace" font-size="9" fill="#999" font-weight="700" letter-spacing="0.8">ACTUAL SPENT SO FAR</text>
  <rect x="32" y="208" width="120" height="20" rx="4" fill="#CCCCCC"/>
  <text x="200" y="200" font-family="monospace" font-size="9" fill="#999" font-weight="700" letter-spacing="0.8">DAYS LEFT</text>
  <rect x="200" y="208" width="60" height="20" rx="4" fill="#CCCCCC"/>

  <!-- Progress bar with zones -->
  <rect x="16" y="268" width="358" height="16" rx="8" fill="#CCCCCC"/>
  <rect x="16" y="268" width="200" height="16" rx="8" fill="#BBBBBB"/>
  <!-- Zone markers -->
  <line x1="216" y1="264" x2="216" y2="288" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="296" y1="264" x2="296" y2="288" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="216" y="298" font-family="monospace" font-size="8" fill="#999" font-weight="700" letter-spacing="0.4" text-anchor="middle">SAFE</text>
  <text x="296" y="298" font-family="monospace" font-size="8" fill="#999" font-weight="700" letter-spacing="0.4" text-anchor="middle">CAUTION</text>

  <!-- Daily allowance card -->
  <rect x="16" y="310" width="170" height="80" rx="8" fill="#D8D8D8"/>
  <text x="28" y="330" font-family="monospace" font-size="9" fill="#999" font-weight="700" letter-spacing="0.8">DAILY ALLOWANCE</text>
  <rect x="28" y="338" width="90" height="20" rx="4" fill="#CCCCCC"/>
  <text x="28" y="374" font-family="monospace" font-size="8" fill="#AAAAAA" font-weight="700" letter-spacing="0.5">TO STAY WITHIN LIMIT</text>

  <!-- Days on track card -->
  <rect x="204" y="310" width="170" height="80" rx="8" fill="#D8D8D8"/>
  <text x="216" y="330" font-family="monospace" font-size="9" fill="#999" font-weight="700" letter-spacing="0.8">DAYS ON TRACK</text>
  <rect x="216" y="338" width="90" height="20" rx="4" fill="#CCCCCC"/>
  <text x="216" y="374" font-family="monospace" font-size="8" fill="#AAAAAA" font-weight="700" letter-spacing="0.5">OUT OF 12 DAYS</text>

  <!-- Spend forecast chart -->
  <text x="16" y="416" font-family="monospace" font-size="9" fill="#999" font-weight="700" letter-spacing="0.8">SPEND FORECAST</text>
  <rect x="16" y="426" width="358" height="100" rx="8" fill="#D8D8D8"/>
  <!-- Bar chart placeholders -->
  <rect x="32" y="496" width="20" height="22" fill="#CCCCCC"/>
  <rect x="58" y="480" width="20" height="38" fill="#BBBBBB"/>
  <rect x="84" y="488" width="20" height="30" fill="#CCCCCC"/>
  <rect x="110" y="468" width="20" height="50" fill="#BBBBBB"/>
  <rect x="136" y="476" width="20" height="42" fill="#CCCCCC"/>
  <rect x="162" y="484" width="20" height="34" fill="#BBBBBB"/>
  <rect x="188" y="472" width="20" height="46" fill="#CCCCCC"/>
  <rect x="214" y="490" width="20" height="28" stroke="#999" stroke-width="1" stroke-dasharray="3,2" fill="#D8D8D8"/>
  <rect x="240" y="486" width="20" height="32" stroke="#999" stroke-width="1" stroke-dasharray="3,2" fill="#D8D8D8"/>
  <text x="195" y="540" font-family="monospace" font-size="8" fill="#999" font-weight="700" letter-spacing="0.5" text-anchor="middle">↑ DASHED = PROJECTED REMAINING DAYS</text>

  <!-- No-panic insight -->
  <rect x="16" y="556" width="358" height="56" rx="8" fill="#D0D0D0" stroke="#BBBBBB" stroke-width="1"/>
  <text x="32" y="576" font-family="monospace" font-size="9" fill="#999" font-weight="700" letter-spacing="0.8">CALM INSIGHT CARD</text>
  <rect x="32" y="584" width="294" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="32" y="596" width="200" height="8" rx="2" fill="#CCCCCC"/>
  <text x="16" y="626" font-family="monospace" font-size="8" fill="#999" font-weight="700" letter-spacing="0.5">↑ REASSURANCE MSG — "YOU'RE ON TRACK" OR WARNING</text>

  <!-- Payment due reminder -->
  <rect x="16" y="640" width="358" height="52" rx="8" fill="#D8D8D8"/>
  <rect x="28" y="652" width="24" height="24" rx="6" fill="#CCCCCC"/>
  <rect x="62" y="654" width="140" height="8" rx="2" fill="#BBBBBB"/>
  <rect x="62" y="666" width="90" height="6" rx="2" fill="#CCCCCC"/>
  <rect x="310" y="656" width="50" height="20" rx="10" fill="#CCCCCC"/>

  <!-- Bottom nav -->
  <rect y="780" width="390" height="64" fill="#D0D0D0"/>
  <rect x="22" y="804" width="34" height="24" rx="4" fill="#CCCCCC"/>
  <rect x="100" y="804" width="34" height="24" rx="4" fill="#CCCCCC"/>
  <rect x="178" y="804" width="34" height="24" rx="4" fill="#CCCCCC"/>
  <rect x="256" y="804" width="34" height="24" rx="4" fill="#BBBBBB"/>
  <rect x="334" y="804" width="34" height="24" rx="4" fill="#CCCCCC"/>
  <text x="273" y="796" font-family="monospace" font-size="8" fill="#888" font-weight="700" letter-spacing="0.5" text-anchor="middle">● ACTIVE</text>
</svg>