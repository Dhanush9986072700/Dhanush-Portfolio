<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="-apple-system,'SF Pro Display',system-ui,sans-serif">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B8DF8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6B5CE7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4A3DB0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9A74B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F9A74B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7FF9"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="390" height="844" fill="#0A0A1C"/>
  <!-- Ambient glow orbs -->
  <ellipse cx="195" cy="300" rx="200" ry="200" fill="url(#orb)"/>
  <ellipse cx="310" cy="500" rx="120" ry="120" fill="url(#orb2)"/>
  <!-- Status bar -->
  <text x="24" y="30" font-size="15" font-weight="600" fill="white">9:41</text>
  <text x="340" y="30" font-size="13" font-weight="500" fill="rgba(255,255,255,0.7)">100%</text>
  <!-- Logo -->
  <text x="195" y="94" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="6" fill="white">VAULT</text>
  <text x="195" y="112" text-anchor="middle" font-size="10" font-weight="500" letter-spacing="2" fill="rgba(255,255,255,0.35)">PERSONAL FINANCE</text>
  <!-- Skip -->
  <text x="358" y="82" text-anchor="middle" font-size="14" font-weight="500" fill="rgba(255,255,255,0.35)">Skip</text>
  <!-- Illustration area: abstract coins/chart visual -->
  <circle cx="195" cy="282" r="110" fill="rgba(124,110,248,0.12)" stroke="rgba(124,110,248,0.2)" stroke-width="1"/>
  <circle cx="195" cy="282" r="78" fill="rgba(124,110,248,0.1)" stroke="rgba(124,110,248,0.15)" stroke-width="1"/>
  <!-- Chart bars inside illustration -->
  <rect x="130" y="310" width="22" height="40" rx="4" fill="rgba(124,110,248,0.5)"/>
  <rect x="162" y="290" width="22" height="60" rx="4" fill="rgba(124,110,248,0.7)"/>
  <rect x="194" y="272" width="22" height="78" rx="4" fill="#7C6EF8"/>
  <rect x="226" y="282" width="22" height="68" rx="4" fill="rgba(124,110,248,0.7)"/>
  <rect x="258" y="298" width="22" height="52" rx="4" fill="rgba(124,110,248,0.5)"/>
  <!-- Trend line -->
  <polyline points="141,322 173,296 205,272 237,285 269,302" fill="none" stroke="#9B8DF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Floating badge -->
  <rect x="260" y="224" width="86" height="36" rx="18" fill="rgba(80,216,150,0.15)" stroke="rgba(80,216,150,0.3)" stroke-width="1"/>
  <text x="303" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="#50D896">+12.4%</text>
  <text x="303" y="252" text-anchor="middle" font-size="9" fill="rgba(80,216,150,0.7)">this month</text>
  <!-- Progress dots -->
  <circle cx="183" cy="420" r="5" fill="#7C6EF8"/>
  <circle cx="198" cy="420" r="3.5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="211" cy="420" r="3.5" fill="rgba(255,255,255,0.2)"/>
  <!-- Headline -->
  <text x="40" y="462" font-size="34" font-weight="800" fill="white" letter-spacing="-0.5">Track every</text>
  <text x="40" y="500" font-size="34" font-weight="800" fill="white" letter-spacing="-0.5">rupee. Grow</text>
  <text x="40" y="538" font-size="34" font-weight="800" fill="white" letter-spacing="-0.5">every month.</text>
  <!-- Subtext -->
  <text x="40" y="574" font-size="15" fill="rgba(255,255,255,0.5)" font-weight="400">One app for budgets, expenses,</text>
  <text x="40" y="594" font-size="15" fill="rgba(255,255,255,0.5)" font-weight="400">and your financial goals.</text>
  <!-- CTA button -->
  <rect x="32" y="624" width="326" height="56" rx="28" fill="url(#btn)"/>
  <text x="195" y="658" text-anchor="middle" font-size="16" font-weight="700" fill="white">Get started →</text>
  <!-- Sign in -->
  <text x="195" y="710" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.4)">Already have an account? <tspan fill="rgba(124,110,248,0.9)" font-weight="600">Sign in</tspan></text>
  <!-- Home indicator -->
  <rect x="150" y="820" width="90" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
</svg>