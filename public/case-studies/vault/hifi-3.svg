<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="-apple-system,'SF Pro Display',system-ui,sans-serif">
  <defs>
    <linearGradient id="savebtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7FF9"/>
      <stop offset="100%" stop-color="#6554E7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="390" height="844" fill="#0A0A1C"/>
  <!-- Status bar -->
  <text x="24" y="30" font-size="15" font-weight="600" fill="white">9:41</text>
  <text x="340" y="30" font-size="13" font-weight="500" fill="rgba(255,255,255,0.6)">100%</text>
  <!-- Header -->
  <rect x="20" y="56" width="36" height="36" rx="12" fill="rgba(255,255,255,0.07)"/>
  <text x="38" y="79" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.8)">←</text>
  <text x="195" y="80" text-anchor="middle" font-size="18" font-weight="700" fill="white">New Expense</text>
  <rect x="334" y="56" width="36" height="36" rx="12" fill="rgba(255,255,255,0.07)"/>
  <text x="352" y="79" text-anchor="middle" font-size="18" fill="rgba(255,255,255,0.5)">✕</text>
  <!-- Type toggle -->
  <rect x="20" y="112" width="350" height="48" rx="24" fill="rgba(255,255,255,0.06)"/>
  <rect x="24" y="116" width="170" height="40" rx="20" fill="#F87171"/>
  <text x="109" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="white">Expense</text>
  <text x="283" y="141" text-anchor="middle" font-size="15" font-weight="500" fill="rgba(255,255,255,0.4)">Income</text>
  <!-- Amount display -->
  <text x="195" y="210" text-anchor="middle" font-size="62" font-weight="800" fill="white" letter-spacing="-2">₹ 0.00</text>
  <text x="195" y="240" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.3)">Tap to enter amount</text>
  <!-- Category label -->
  <text x="20" y="278" font-size="13" font-weight="600" letter-spacing="1" fill="rgba(255,255,255,0.35)">CATEGORY</text>
  <!-- Category grid row 1 -->
  <rect x="20" y="290" width="104" height="84" rx="16" fill="rgba(249,167,75,0.1)" stroke="rgba(249,167,75,0.2)" stroke-width="1"/>
  <text x="72" y="320" text-anchor="middle" font-size="28">🍕</text>
  <text x="72" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Food</text>
  <rect x="143" y="290" width="104" height="84" rx="16" fill="rgba(124,110,248,0.08)" stroke="rgba(124,110,248,0.15)" stroke-width="1"/>
  <text x="195" y="320" text-anchor="middle" font-size="28">🚗</text>
  <text x="195" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Transport</text>
  <rect x="266" y="290" width="104" height="84" rx="16" fill="rgba(124,110,248,0.08)" stroke="rgba(124,110,248,0.15)" stroke-width="1"/>
  <text x="318" y="320" text-anchor="middle" font-size="28">🛍</text>
  <text x="318" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Shopping</text>
  <!-- Category grid row 2 -->
  <rect x="20" y="386" width="104" height="84" rx="16" fill="rgba(124,110,248,0.08)" stroke="rgba(124,110,248,0.15)" stroke-width="1"/>
  <text x="72" y="416" text-anchor="middle" font-size="28">⚡</text>
  <text x="72" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Bills</text>
  <rect x="143" y="386" width="104" height="84" rx="16" fill="rgba(124,110,248,0.08)" stroke="rgba(124,110,248,0.15)" stroke-width="1"/>
  <text x="195" y="416" text-anchor="middle" font-size="28">❤️</text>
  <text x="195" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">Health</text>
  <rect x="266" y="386" width="104" height="84" rx="16" fill="rgba(124,110,248,0.08)" stroke="rgba(124,110,248,0.15)" stroke-width="1"/>
  <text x="318" y="416" text-anchor="middle" font-size="28">···</text>
  <text x="318" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="rgba(255,255,255,0.8)">More</text>
  <!-- Note field -->
  <text x="20" y="498" font-size="13" font-weight="600" letter-spacing="1" fill="rgba(255,255,255,0.35)">NOTE</text>
  <rect x="20" y="508" width="350" height="54" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="40" y="540" font-size="15" fill="rgba(255,255,255,0.25)">Add a note…</text>
  <!-- Date row -->
  <text x="20" y="592" font-size="13" font-weight="600" letter-spacing="1" fill="rgba(255,255,255,0.35)">DATE</text>
  <rect x="20" y="602" width="350" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="40" y="633" font-size="15" font-weight="500" fill="white">Today, Wed 7 May 2026</text>
  <text x="354" y="633" text-anchor="end" font-size="20" fill="rgba(255,255,255,0.35)">›</text>
  <!-- Save button -->
  <rect x="20" y="676" width="350" height="56" rx="28" fill="url(#savebtn)"/>
  <text x="195" y="710" text-anchor="middle" font-size="17" font-weight="700" fill="white">Save Transaction</text>
  <!-- Keyboard hint -->
  <rect x="0" y="752" width="390" height="78" fill="rgba(255,255,255,0.03)" stroke-top="rgba(255,255,255,0.08)"/>
  <line x1="0" y1="752" x2="390" y2="752" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="195" y="793" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.2)">Numeric keyboard appears here</text>
  <!-- Home indicator -->
  <rect x="150" y="826" width="90" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
</svg>