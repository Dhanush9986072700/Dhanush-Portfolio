<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="-apple-system,'SF Pro Display',system-ui,sans-serif">
  <defs>
    <radialGradient id="avatar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B8DF8"/>
      <stop offset="100%" stop-color="#5B4DD0"/>
    </radialGradient>
    <linearGradient id="logoutbtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="390" height="844" fill="#0A0A1C"/>
  <!-- Status bar -->
  <text x="24" y="30" font-size="15" font-weight="600" fill="white">9:41</text>
  <text x="340" y="30" font-size="13" font-weight="500" fill="rgba(255,255,255,0.6)">100%</text>
  <!-- Header -->
  <text x="195" y="68" text-anchor="middle" font-size="22" font-weight="800" fill="white" letter-spacing="-0.3">Profile</text>
  <rect x="334" y="52" width="36" height="36" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="352" y="75" text-anchor="middle" font-size="16">⚙️</text>
  <!-- Avatar -->
  <circle cx="195" cy="148" r="44" fill="url(#avatar)"/>
  <text x="195" y="159" text-anchor="middle" font-size="26" font-weight="800" fill="white">DN</text>
  <!-- Verified badge -->
  <circle cx="228" cy="178" r="12" fill="#50D896"/>
  <text x="228" y="183" text-anchor="middle" font-size="12" fill="white">✓</text>
  <!-- Name + email -->
  <text x="195" y="212" text-anchor="middle" font-size="20" font-weight="800" fill="white">Dhanush N.</text>
  <text x="195" y="234" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.4)">dhanush@xiphias.in</text>
  <!-- Stats row -->
  <rect x="20" y="256" width="107" height="64" rx="14" fill="rgba(124,110,248,0.08)" stroke="rgba(124,110,248,0.15)" stroke-width="1"/>
  <rect x="141" y="256" width="107" height="64" rx="14" fill="rgba(124,110,248,0.08)" stroke="rgba(124,110,248,0.15)" stroke-width="1"/>
  <rect x="262" y="256" width="107" height="64" rx="14" fill="rgba(124,110,248,0.08)" stroke="rgba(124,110,248,0.15)" stroke-width="1"/>
  <text x="73" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#7C6EF8">6</text>
  <text x="73" y="301" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="0.3">MONTHS</text>
  <text x="194" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#7C6EF8">₹2.4L</text>
  <text x="194" y="301" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="0.3">TRACKED</text>
  <text x="315" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#7C6EF8">12</text>
  <text x="315" y="301" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="0.3">CATEGORIES</text>
  <!-- Account section -->
  <text x="20" y="350" font-size="12" font-weight="700" letter-spacing="1.2" fill="rgba(255,255,255,0.3)">ACCOUNT</text>
  <rect x="20" y="362" width="350" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="40" y="386" font-size="15" font-weight="600" fill="white">Connected Accounts</text>
  <text x="40" y="404" font-size="12" fill="rgba(255,255,255,0.35)">2 accounts linked</text>
  <text x="354" y="396" text-anchor="end" font-size="18" fill="rgba(255,255,255,0.2)">›</text>
  <line x1="20" y1="418" x2="370" y2="418" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="20" y="418" width="350" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="40" y="442" font-size="15" font-weight="600" fill="white">Export Data</text>
  <text x="40" y="460" font-size="12" fill="rgba(255,255,255,0.35)">CSV · PDF · JSON</text>
  <text x="354" y="452" text-anchor="end" font-size="18" fill="rgba(255,255,255,0.2)">›</text>
  <line x1="20" y1="474" x2="370" y2="474" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="20" y="474" width="350" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="40" y="498" font-size="15" font-weight="600" fill="white">Currency</text>
  <text x="40" y="516" font-size="12" fill="rgba(255,255,255,0.35)">Indian Rupee (₹)</text>
  <text x="354" y="508" text-anchor="end" font-size="18" fill="rgba(255,255,255,0.2)">›</text>
  <!-- Preferences section -->
  <text x="20" y="556" font-size="12" font-weight="700" letter-spacing="1.2" fill="rgba(255,255,255,0.3)">PREFERENCES</text>
  <rect x="20" y="568" width="350" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="40" y="592" font-size="15" font-weight="600" fill="white">Notifications</text>
  <text x="40" y="610" font-size="12" fill="rgba(255,255,255,0.35)">Spend alerts, weekly summary</text>
  <!-- Toggle ON -->
  <rect x="318" y="584" width="44" height="26" rx="13" fill="#7C6EF8"/>
  <circle cx="350" cy="597" r="10" fill="white"/>
  <line x1="20" y1="624" x2="370" y2="624" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <rect x="20" y="624" width="350" height="56" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="40" y="648" font-size="15" font-weight="600" fill="white">Dark Mode</text>
  <text x="40" y="666" font-size="12" fill="rgba(255,255,255,0.35)">Always on</text>
  <!-- Toggle ON -->
  <rect x="318" y="640" width="44" height="26" rx="13" fill="#7C6EF8"/>
  <circle cx="350" cy="653" r="10" fill="white"/>
  <!-- Log out -->
  <rect x="20" y="706" width="350" height="54" rx="27" fill="url(#logoutbtn)" stroke="rgba(248,113,113,0.3)" stroke-width="1"/>
  <text x="195" y="739" text-anchor="middle" font-size="16" font-weight="700" fill="#F87171">Log Out</text>
  <!-- Bottom nav -->
  <rect x="0" y="776" width="390" height="1" fill="rgba(255,255,255,0.08)"/>
  <rect x="0" y="777" width="390" height="67" fill="#0A0A1C"/>
  <text x="49" y="804" text-anchor="middle" font-size="20">⊞</text>
  <text x="49" y="824" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)" letter-spacing="0.3">HOME</text>
  <text x="125" y="804" text-anchor="middle" font-size="20">📊</text>
  <text x="125" y="824" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)" letter-spacing="0.3">STATS</text>
  <rect x="168" y="776" width="54" height="46" rx="16" fill="#7C6EF8"/>
  <text x="195" y="805" text-anchor="middle" font-size="26" font-weight="300" fill="white">+</text>
  <text x="265" y="804" text-anchor="middle" font-size="20">💳</text>
  <text x="265" y="824" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.3)" letter-spacing="0.3">CARDS</text>
  <rect x="312" y="780" width="58" height="38" rx="12" fill="rgba(124,110,248,0.15)"/>
  <text x="341" y="804" text-anchor="middle" font-size="20">👤</text>
  <text x="341" y="824" text-anchor="middle" font-size="9" font-weight="600" fill="#7C6EF8" letter-spacing="0.3">PROFILE</text>
  <!-- Home indicator -->
  <rect x="150" y="832" width="90" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
</svg>