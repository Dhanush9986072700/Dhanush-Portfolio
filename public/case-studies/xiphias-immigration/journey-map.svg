  <rect x="8"    y="130" width="222" height="60" rx="5" fill="#FFFFFF" stroke="#E0E0D8" stroke-width="1"/>
  <text x="17" y="148" font-size="10" fill="#374151">"I just got a job offer in London.</text>
  <text x="17" y="163" font-size="10" fill="#374151">Where do I even start with</text>
  <text x="17" y="178" font-size="10" fill="#374151">a Skilled Worker visa?"</text>
  <text x="17" y="187" font-size="8"  fill="#9CA3AF">— Software engineer, Bangalore</text>

  <rect x="248"  y="130" width="222" height="60" rx="5" fill="#FFFFFF" stroke="#E0E0D8" stroke-width="1"/>
  <text x="257" y="148" font-size="10" fill="#374151">"The points calculator says I</text>
  <text x="257" y="163" font-size="10" fill="#374151">need 70. I think I have 55.</text>
  <text x="257" y="178" font-size="10" fill="#374151">Am I even eligible?"</text>
  <text x="257" y="187" font-size="8"  fill="#9CA3AF">— UX designer, Hyderabad</text>

  <rect x="488"  y="130" width="222" height="60" rx="5" fill="#FFFFFF" stroke="#E0E0D8" stroke-width="1"/>
  <text x="497" y="148" font-size="10" fill="#374151">"23 documents. Which format?</text>
  <text x="497" y="163" font-size="10" fill="#374151">How old can my transcripts be?</text>
  <text x="497" y="178" font-size="10" fill="#374151">I'm tracking this in a spreadsheet."</text>
  <text x="497" y="187" font-size="8"  fill="#9CA3AF">— Data analyst, Pune</text>

  <rect x="728"  y="130" width="222" height="60" rx="5" fill="#FFFFFF" stroke="#E0E0D8" stroke-width="1"/>
  <text x="737" y="148" font-size="10" fill="#374151">"I've submitted. Did I miss</text>
  <text x="737" y="163" font-size="10" fill="#374151">anything? No confirmation</text>
  <text x="737" y="178" font-size="10" fill="#374151">email for three days."</text>
  <text x="737" y="187" font-size="8"  fill="#9CA3AF">— Product manager, Chennai</text>

  <rect x="968"  y="130" width="222" height="60" rx="5" fill="#FFFFFF" stroke="#E0E0D8" stroke-width="1"/>
  <text x="977" y="148" font-size="10" fill="#374151">"Day 38. Still says Under Review.</text>
  <text x="977" y="163" font-size="10" fill="#374151">What does that actually mean?</text>
  <text x="977" y="178" font-size="10" fill="#374151">Is anyone looking at my case?"</text>
  <text x="977" y="187" font-size="8"  fill="#9CA3AF">— Backend engineer, Mumbai</text>

  <rect x="1208" y="130" width="222" height="60" rx="5" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="1217" y="148" font-size="10" fill="#374151">"Approved. Now I need to</text>
  <text x="1217" y="163" font-size="10" fill="#374151">collect my BRP, sort housing,</text>
  <text x="1217" y="178" font-size="10" fill="#374151">and book flights."</text>
  <text x="1217" y="187" font-size="8"  fill="#9CA3AF">— Finance analyst, Delhi</text>

